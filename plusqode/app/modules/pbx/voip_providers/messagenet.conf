[${phone_number$s}-auth]
type=auth
username=${username$s}
password=${password$s}

[${phone_number$s}-reg]
type=registration
server_uri=sip:sip.messagenet.it:5061
client_uri=sip:${username$s}@sip.messagenet.it:5061
outbound_auth=${phone_number$s}-auth

[${phone_number$s}-trunk]
type=endpoint
context=from-${phone_number$s}
disallow=all
allow=alaw,ulaw
outbound_auth=${phone_number$s}-auth
aors=${phone_number$s}-aor

[${phone_number$s}-aor]
type=aor
contact=sip:sip.messagenet.it:5061

[${phone_number$s}-identify]
type=identify
endpoint=${phone_number$s}-trunk
match=sip.messagenet.it
