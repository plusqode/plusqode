[${phone_number$s}-aor]
type = aor
contact = sip:${phone_number$s}.sip.twilio.com:5060

[${phone_number$s}-endpoint]
type = endpoint
transport = transport-udp
outbound_auth = ${phone_number$s}-auth
aors = ${phone_number$s}-aor
from_domain = ${phone_number$s}.sip.twilio.com
context = from-${phone_number$s}
disallow = all
allow = ulaw

[${phone_number$s}-identify]
type = identify
endpoint = ${phone_number$s}-endpoint
match = ${username$s}
